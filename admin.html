<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jirani Properties</title>
    <link rel="icon" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Admin Styles -->
    <link rel="stylesheet" href="css/admin.css">

    <!-- Dependencies (Icons + Firebase) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                Jirani<span style="color:#2d60ff">Admin</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" id="nav-airbnbs" onclick="switchTab('airbnbs')">
                <i class="fas fa-home"></i>
                <span>Airbnbs</span>
            </a>
            <a href="#" class="nav-item" id="nav-properties" onclick="switchTab('properties')">
                <i class="fas fa-building"></i>
                <span>Properties</span>
            </a>
            <a href="index.html" class="nav-item" target="_blank">
                <i class="fas fa-external-link-alt"></i>
                <span>View Site</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item" id="logout-btn" style="color:#ef4444;">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <div class="topbar">
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="menu-toggle" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title" id="page-title">Manage Airbnbs</h1>
            </div>

            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="search-input" placeholder="Search listings...">
            </div>
        </div>

        <!-- Actions -->
        <div class="actions-bar">
            <div>
                <!-- Could add filters here later -->
            </div>
            <button class="btn btn-primary" onclick="openEditModal()">
                <i class="fas fa-plus"></i> Add New
            </button>
        </div>

        <!-- Listings Table -->
        <div class="table-card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="80">Image</th>
                            <th>Title/ID</th>
                            <th>Location</th>
                            <th>Price</th>
                            <th id="th-type" style="display:none;">Type</th>
                            <th width="150">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Data inserted by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Edit Listing</h3>
                <button style="background:none; border:none; font-size:1.2rem; cursor:pointer;"
                    onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-form">
                    <div class="form-group">
                        <label class="form-label">Title</label>
                        <input type="text" id="edit-title" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="edit-desc" class="form-control" rows="3"></textarea>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div class="form-group">
                            <label class="form-label">Location</label>
                            <input type="text" id="edit-location" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Price (KES)</label>
                            <input type="number" id="edit-price" class="form-control" required>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px;">
                        <div class="form-group">
                            <label class="form-label">Beds/Rooms</label>
                            <input type="text" id="edit-rooms" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Baths</label>
                            <input type="number" id="edit-baths" class="form-control">
                        </div>
                        <div class="form-group" id="type-group" style="display:none;">
                            <label class="form-label">Type</label>
                            <select id="edit-type" class="form-control">
                                <option value="rent">Rent</option>
                                <option value="sale">Sale</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Amenities (Comma separated)</label>
                        <input type="text" id="edit-amenities" class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Images</label>
                        <input type="file" id="image-input" multiple accept="image/*" class="form-control">
                        <div class="upload-grid" id="upload-preview"></div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" style="background:transparent; color:#666;"
                            onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
